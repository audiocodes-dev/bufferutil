name: CI

on:
  - push
  - pull_request

permissions: {}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        arch:
          - x64
          - arm64
        node:
          - 22
          - 24
          - 26
        os:
          - macos-latest
          - macos-15-intel
          - ubuntu-latest
          - ubuntu-24.04-arm
          - windows-latest
        exclude:
          - arch: arm64
            os: macos-15-intel
          - arch: arm64
            os: ubuntu-latest
          - arch: arm64
            os: windows-latest
          - arch: x64
            os: macos-latest
          - arch: x64
            os: ubuntu-24.04-arm
        include:
          - arch: x86
            node: 22
            os: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          architecture: ${{ matrix.arch }}
      - run: npm install
      - run: npm test
  build:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        arch:
          - x64
        os:
          - macos-15-intel
          - ubuntu-22.04
          - windows-latest
        include:
          - arch: x86
            os: windows-latest
          - arch: arm64
            os: macos-latest
          - arch: arm64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          architecture: ${{ matrix.arch }}
      - run: npm install
      - run: npm run prebuild
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os }}-${{ matrix.arch }}
          path: prebuilds
          retention-days: 1
  release:
    needs: build
    permissions:
      contents: write # Needed for softprops/action-gh-release.
      id-token: write # Needed for npm trusted publishing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      # Each artifact holds prebuilds/<platform>-<arch>/, merged into the
      # layout node-gyp-build looks for.
      - uses: actions/download-artifact@v8
        with:
          path: prebuilds
          merge-multiple: true
      - run: echo "version=$(git describe --tags)" >> $GITHUB_OUTPUT
        id: get_version
      - run: |
          for p in $(ls prebuilds); do
            tar -cvf "${{ steps.get_version.outputs.version }}-$p.tar" -C prebuilds "$p"
          done
      - uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.get_version.outputs.version }}-*.tar
          token: ${{ secrets.GITHUB_TOKEN }}
      # A prerelease version (4.1.0-ac.N) needs an explicit tag.
      - run: npm publish --access public --tag latest
